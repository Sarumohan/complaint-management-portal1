<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Complaint Management Portal</title>

    <link rel="stylesheet" href="register.css">
   

</head>
 

<body>

<div class="background-overlay"></div>

<div class="container">

    <div class="logo">
        <img src="icon.png" class="icon">

        <span>Complaint Management Portal</span>

    </div>

    <div class="registercard">

        <h2>Create Account</h2>

        <p>Create your account to continue</p>

        <form
    id="register-form"
    action=""
    autocomplete="off">
            <div class="input-box">

                <input
                    type="text"
                    id="full-name"
                    name="fullname"
                    placeholder="Full Name"
                    autocomplete="off"
                    required>

            </div>

            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    autocomplete="off"
                    required>

            </div>

            <div class="input-box">

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Phone Number"
                    autocomplete="off"
                    required>

            </div>

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create Password"
                    autocomplete="new-password"
                    required>

            </div>

            <div class="input-box">

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required>

            </div>

            <div class="terms">

                <label>

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required>

                    I agree to the Terms & Conditions

                </label>

            </div>

            <div id="register-message"></div>

            <button
                type="submit"
                class="register-btn"
                id="register-btn">

                Create Account

            </button>

        </form>

        <div class="bottom-links">

            <a
                href="login.html"
                id="login-link">

                Already have an account?

                <strong>Login</strong>

            </a>

        </div>

        <div class="home-link">

            <a
                href="home.html"
                id="home-link">

                Back to Home

            </a>

        </div>

    </div>

</div>
<script src="register.js"></script>

</body>


</html>

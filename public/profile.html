<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | Complaint Management Portal</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="profile.css">

</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-shield-halved"></i>

            <h2>Complaint Portal</h2>

        </div>

        <ul class="menu">

            <li>

                <a href="dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="complaint.html">

                    <i class="fa-solid fa-file-circle-plus"></i>

                    Register Complaint

                </a>

            </li>

            <li>

                <a href="track.html">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Track Complaint

                </a>

            </li>

            <li>

                <a href="history.html">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    Complaint History

                </a>

            </li>

            <li>

                <a href="notification.html">

                    <i class="fa-regular fa-bell"></i>

                    Notifications

                </a>

            </li>

            <li class="active">

                <a href="#">

                    <i class="fa-regular fa-user"></i>

                    My Profile

                </a>

            </li>

        </ul>

        <div class="logout">

            <a href="index.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                        type="text"
                        id="search"
                        name="search"
                        placeholder="Search...">

            </div>

            <div class="top-right">

                <div class="notification">

                    <i class="fa-regular fa-bell"></i>

                    <span id="notification-count">0</span>

                </div>

                <div class="profile">

                    <img src="profile.png"
                         alt="Profile">

                    <span>User</span>

                </div>

            </div>

        </header>

        <!-- PAGE HEADER -->

        <section class="profile-header">

            <h1>

                My Profile

            </h1>

            <p>

                View and update your personal information.

            </p>

        </section>

        <!-- PROFILE CARD -->

        <section class="profile-card">

            <div class="profile-image">

                <img src="profile.png"
                     id="profile-photo"
                     alt="Profile Photo">

                <button
                        type="button"
                        id="change-photo">

                    <i class="fa-solid fa-camera"></i>

                    Change Photo

                </button>

            </div>

            <div class="profile-form">

                <div class="input-group">

                    <label for="full-name">

                        Full Name

                    </label>

                    <input
                            type="text"
                            id="full-name"
                            name="fullName"
                            placeholder="Enter your full name">

                </div>

                <div class="input-group">

                    <label for="email">

                        Email Address

                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email">

                </div>

                <div class="input-group">

                    <label for="phone">

                        Phone Number

                    </label>

                    <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number">

                </div>

                <div class="input-group">

                    <label for="address">

                        Address

                    </label>

                    <textarea
                            id="address"
                            name="address"
                            rows="4"
                            placeholder="Enter your address"></textarea>

                </div>

                <div class="input-group">

                    <label for="password">

                        Change Password

                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter new password">

                </div>

                <div id="profile-message"></div>

                <div class="button-group">

                    <button
                            type="button"
                            class="edit-btn"
                            id="edit-profile">

                        <i class="fa-solid fa-pen"></i>

                        Edit Profile

                    </button>

                    <button
                            type="button"
                            class="save-btn"
                            id="save-profile">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Changes

                    </button>

                </div>

            </div>

        </section>

    </main>

</div>

</body>

</html>

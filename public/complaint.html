<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Complaint | Complaint Management Portal</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="complaint.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-shield-halved"></i>

            <h2>Complaint Portal</h2>

        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-file-circle-plus"></i>
                    Register Complaint
                </a>
            </li>

            <li>
                <a href="track.html">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Track Complaint
                </a>
            </li>

            <li>
                <a href="history.html">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Complaint History
                </a>
            </li>

            <li>
                <a href="notification.html">
                    <i class="fa-regular fa-bell"></i>
                    Notifications
                </a>
            </li>

            <li>
                <a href="profile.html">
                    <i class="fa-regular fa-user"></i>
                    My Profile
                </a>
            </li>

        </ul>

        <div class="logout"> /.,
            <a href="index.html">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                        type="text"
                        id="search"
                        name="search"
                        placeholder="Search...">

            </div>

            <div class="top-right">

                <div class="notification">

                    <i class="fa-regular fa-bell"></i>

                    <span>0</span>

                </div>

                <div class="profile">

                    <img src="profile.png"
                         alt="Profile">

                    <span>User</span>

                </div>

            </div>

        </header>

        <section class="complaint-section">

            <div class="title">

                <h1>Register a New Complaint</h1>

                <p>
                    Fill in the information below to submit your complaint.
                </p>

            </div>

            <form
                    class="complaint-form"
                    id="complaint-form">

                <div class="form-row">

                    <div class="input-box">

                        <label for="fullname">Full Name</label>

                        <input
                                type="text"
                                id="fullname"
                                name="fullname"
                                placeholder="Enter your full name"
                                required>

                    </div>

                    <div class="input-box">

                        <label for="email">Email Address</label>

                        <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="input-box">

                        <label for="phone">Phone Number</label>

                        <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="Enter phone number"
                                required>

                    </div>

                    <div class="input-box">

                        <label for="department">Department</label>

                        <select
                                id="department"
                                name="department"
                                required>

                            <option value="" selected disabled>Select Department</option>

                            <option>Water Supply</option>

                            <option>Electricity</option>

                            <option>Road & Transport</option>

                            <option>Health</option>

                            <option>Education</option>

                            <option>Municipality</option>

                        </select>

                    </div>

                </div>

                <div class="input-box">

                    <label for="category">Complaint Category</label>

                    <select
                            id="category"
                            name="category"
                            required>

                        <option value="" selected disabled>Select Category</option>

                        <option>Service Delay</option>

                        <option>Technical Issue</option>

                        <option>Corruption</option>

                        <option>Public Safety</option>

                        <option>Others</option>

                    </select>

                </div>

                <div class="input-box">

                    <label for="complaint-title">Complaint Title</label>

                    <input
                            type="text"
                            id="complaint-title"
                            name="complaintTitle"
                            placeholder="Enter complaint title"
                            required>

                </div>

                <div class="input-box">

                    <label for="description">Complaint Description</label>

                    <textarea
                            id="description"
                            name="description"
                            rows="7"
                            placeholder="Describe your complaint..."
                            required></textarea>

                </div>

                <div class="form-row">

                    <div class="input-box">

                        <label for="location">Location</label>

                        <input
                                type="text"
                                id="location"
                                name="location"
                                placeholder="Complaint location">

                    </div>

                    <div class="input-box">

                        <label for="attachment">Upload Image / Document</label>

                        <input
                                type="file"
                                id="photo"
                                name="photo">

                    </div>

                </div>

                <div class="priority">

                    <label>Priority</label>

                    <div class="radio-group">

                        <label>

                            <input
                                    type="radio"
                                    id="low"
                                    name="priority"
                                    value="Low">

                            Low

                        </label>

                        <label>

                            <input
                                    type="radio"
                                    id="medium"
                                    name="priority"
                                    value="Medium">

                            Medium

                        </label>

                        <label>

                            <input
                                    type="radio"
                                    id="high"
                                    name="priority"
                                    value="High">

                            High

                        </label>

                    </div>

                </div>

                <div class="terms">

                    <label>

                        <input
                                type="checkbox"
                                id="terms"
                                name="terms"
                                required>

                        I confirm that the information provided is correct.

                    </label>

                </div>

                <div id="complaint-message"></div>

                <div class="buttons">

                    <a href="dashboard.html"
                       class="back-btn"
                       id="back-btn">

                        Back to Dashboard

                    </a>

                    <button
                            type="submit"
                            class="submit-btn"
                            id="submit-btn">

                        Submit Complaint

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="complaint.js"></script>

</body>

</html>
